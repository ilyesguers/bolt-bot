name: Deploy to Railway

on:
  push:
    branches: [ "arena/019fdca0-bolt-bot" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/*.py
      - run: python -c "from src.config import is_efootball_host; assert is_efootball_host('api.efootball.konami.net')"

  health:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ready for Railway auto-deploy via GitHub integration"
